<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>게시글 목록</title></head>
<body>
<h1>게시글 목록</h1>
<a href="/boards/new">새 글 쓰기</a>
<p th:if="${#lists.isEmpty(boards)}">아직 게시글이 없습니다.</p>
<ul>
    <li th:each="board : ${boards}">
        <a th:href="@{/boards/{id}(id=${board.id})}" th:text="${board.title}">제목</a>
    </li>
</ul>
<a href="/">처음으로</a>
</body>
</html>
