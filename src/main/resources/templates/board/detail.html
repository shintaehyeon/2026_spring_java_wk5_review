<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>글 상세</title></head>
<body>
<h1 th:text="${board.title}">제목</h1>
<p>글 번호: <span th:text="${board.id}">0</span></p>
<p th:text="${board.content}">내용</p>
<a th:href="@{/boards/{id}/edit(id=${board.id})}">수정</a>
<form th:action="@{/boards/{id}/delete(id=${board.id})}" method="post">
    <button type="submit">삭제</button>
</form>
<a href="/boards">목록으로</a>
</body>
</html>
